[project]
name = "trippilot"
version = "0.1.0"
description = "TripPilot 途行智驾：基于北京真实出行任务的语音优先座舱 Agent 原型 v0.1 脚手架"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "langgraph>=0.1",
  "pydantic>=2.6",
  "pyyaml>=6.0",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
