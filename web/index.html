<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TripPilot 最小体验控制台</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #17211d;
      --muted: #66736d;
      --page: #f5f6f4;
      --paper: #fff;
      --line: #dce2de;
      --green: #176b4d;
      --green-soft: #eaf3ee;
      --danger: #a54b2a;
      --danger-soft: #fbede7;
      --amber: #996116;
      --amber-soft: #fff3df;
      --shadow: 0 14px 36px rgba(24, 45, 36, .07);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--ink);
      background: var(--page);
      font-family: "PingFang SC", "Microsoft YaHei", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    button, input { font: inherit; }
    button { cursor: pointer; }
    button:disabled { cursor: wait; opacity: .58; }
    .shell { width: min(1180px, calc(100% - 40px)); margin: 0 auto; padding-bottom: 44px; }
    .topbar {
      position: sticky;
      top: 0;
      z-index: 5;
      margin: 0 -20px;
      padding: 20px;
      background: rgba(245, 246, 244, .94);
      border-bottom: 1px solid rgba(118, 132, 124, .18);
      backdrop-filter: blur(14px);
    }
    .brand-row { display: flex; align-items: center; justify-content: space-between; gap: 20px; }
    .brand { display: flex; align-items: center; gap: 13px; }
    .mark {
      display: grid;
      width: 42px;
      height: 42px;
      place-items: center;
      border-radius: 12px;
      color: white;
      background: var(--green);
      font-weight: 800;
      letter-spacing: -.04em;
    }
    h1 { margin: 0; font-size: 20px; letter-spacing: -.02em; }
    .subtitle { margin: 4px 0 0; color: var(--muted); font-size: 12px; }
    .badges { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 7px; }
    .badge {
      padding: 6px 10px;
      border: 1px solid #ced9d3;
      border-radius: 999px;
      color: #315245;
      background: rgba(255, 255, 255, .76);
      font-size: 12px;
      font-weight: 650;
    }
    .scenario-panel { padding: 28px 0 22px; }
    .section-title { margin: 0 0 8px; font-size: 15px; }
    .scenario-note { max-width: 900px; margin: 0 0 19px; color: var(--muted); font-size: 12px; line-height: 1.65; }
    .scenario-groups { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 28px; }
    .scenario-group h3 { margin: 0 0 8px; color: var(--muted); font-size: 12px; font-weight: 700; }
    .scenario-list { display: flex; flex-wrap: wrap; gap: 8px; }
    .scenario {
      min-width: 0;
      padding: 9px 12px;
      border: 1px solid var(--line);
      border-radius: 9px;
      color: #30453c;
      background: rgba(255, 255, 255, .82);
      font-size: 13px;
      line-height: 1.45;
      text-align: left;
    }
    .scenario:hover { border-color: #8da99c; color: var(--green); background: white; }
    .scenario:focus-visible, .node-chip:focus-visible, button:focus-visible { outline: 3px solid rgba(23, 107, 77, .2); outline-offset: 2px; }
    .workspace { display: grid; grid-template-columns: minmax(0, 1.04fr) minmax(360px, .96fr); gap: 20px; }
    .panel { border: 1px solid var(--line); border-radius: 18px; background: var(--paper); box-shadow: var(--shadow); }
    .chat-panel { min-height: 680px; display: flex; flex-direction: column; overflow: hidden; }
    .panel-head {
      display: flex;
      min-height: 68px;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 16px 20px;
      border-bottom: 1px solid var(--line);
    }
    .panel-head h2 { margin: 0; font-size: 15px; }
    .vehicle-controls { display: flex; align-items: center; gap: 6px; padding: 4px; border-radius: 10px; background: #eef1ef; }
    .vehicle-controls button {
      padding: 7px 10px;
      border: 0;
      border-radius: 7px;
      color: var(--muted);
      background: transparent;
      font-size: 12px;
    }
    .vehicle-controls button.active { color: white; background: var(--green); }
    .messages { flex: 1; min-height: 370px; padding: 26px 20px; overflow-y: auto; }
    .empty { max-width: 420px; margin: 105px auto; text-align: center; color: var(--muted); line-height: 1.75; }
    .message { display: flex; margin-bottom: 18px; }
    .message.user { justify-content: flex-end; }
    .bubble { max-width: 82%; padding: 12px 15px; border-radius: 14px; line-height: 1.65; white-space: pre-wrap; }
    .assistant .bubble { background: #eff3f0; border-bottom-left-radius: 4px; }
    .user .bubble { color: white; background: var(--green); border-bottom-right-radius: 4px; }
    .error .bubble { color: #8e361d; background: #ffebe3; }
    .confirm-box { display: none; margin: 0 20px 16px; padding: 14px; border: 1px solid #e9c98f; border-radius: 11px; background: var(--amber-soft); }
    .confirm-box.visible { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .confirm-copy { color: #76501f; font-size: 13px; line-height: 1.55; }
    .confirm-button { flex: 0 0 auto; padding: 9px 13px; border: 0; border-radius: 8px; color: white; background: var(--amber); }
    .composer { display: flex; gap: 9px; padding: 16px 20px 20px; border-top: 1px solid var(--line); }
    .composer input { flex: 1; min-width: 0; padding: 12px 14px; border: 1px solid #cfd8d2; border-radius: 10px; color: var(--ink); background: white; line-height: 1.6; outline: none; }
    .composer input:focus { border-color: var(--green); box-shadow: 0 0 0 3px rgba(23, 107, 77, .12); }
    .send-button { padding: 11px 19px; border: 0; border-radius: 10px; color: white; background: var(--green); font-weight: 700; }
    .trace-panel { min-height: 680px; overflow: hidden; }
    .trace-meta { max-width: 190px; overflow: hidden; color: var(--muted); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; text-overflow: ellipsis; white-space: nowrap; }
    .trace-empty { margin: 120px 32px; color: var(--muted); text-align: center; line-height: 1.75; }
    .trajectory { padding: 22px 22px 24px; }
    .node-section + .node-section { margin-top: 21px; padding-top: 19px; border-top: 1px solid #e7ebe8; }
    .node-section-title { margin: 0 0 10px; color: var(--muted); font-size: 11px; font-weight: 700; letter-spacing: .08em; }
    .node-chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .node-chip {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 8px 10px;
      border: 1px solid #cbd3ce;
      border-radius: 999px;
      color: #78827d;
      background: white;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 11px;
    }
    .node-chip::before { width: 7px; height: 7px; border: 1px solid currentColor; border-radius: 50%; content: ""; }
    .node-chip.visited { border-color: var(--green); color: white; background: var(--green); }
    .node-chip.visited::before { border-color: white; background: white; }
    .node-chip.blocked { border-color: var(--danger); color: white; background: var(--danger); }
    .node-chip.selected { box-shadow: 0 0 0 3px rgba(23, 107, 77, .14); }
    .node-chip.blocked.selected { box-shadow: 0 0 0 3px rgba(165, 75, 42, .14); }
    .node-detail { margin-top: 22px; padding: 18px; border: 1px solid var(--line); border-radius: 13px; background: #f8faf8; }
    .node-detail-head { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-bottom: 12px; }
    .node-detail h3 { margin: 0; font-size: 14px; }
    .node-code { margin-left: 6px; color: var(--muted); font: 500 11px ui-monospace, SFMono-Regular, Menlo, monospace; }
    .status { padding: 4px 8px; border-radius: 999px; color: var(--muted); background: #e9edeb; font-size: 11px; }
    .status.visited { color: var(--green); background: var(--green-soft); }
    .status.blocked { color: var(--danger); background: var(--danger-soft); }
    .node-summary { margin: 0; padding: 0; list-style: none; }
    .node-summary li { position: relative; padding-left: 15px; color: #50605a; font-size: 13px; line-height: 1.65; }
    .node-summary li + li { margin-top: 7px; }
    .node-summary li::before { position: absolute; top: .73em; left: 0; width: 5px; height: 5px; border-radius: 50%; background: #91a198; content: ""; }
    @media (max-width: 860px) {
      .brand-row { align-items: flex-start; flex-direction: column; }
      .badges { justify-content: flex-start; }
      .workspace { grid-template-columns: 1fr; }
      .chat-panel, .trace-panel { min-height: auto; }
      .messages { min-height: 390px; }
    }
    @media (max-width: 620px) {
      .shell { width: min(100% - 20px, 1180px); }
      .topbar { margin: 0 -10px; padding: 16px 10px; }
      .scenario-groups { grid-template-columns: 1fr; gap: 14px; }
      .scenario { max-width: 100%; overflow-wrap: anywhere; }
      .panel-head { align-items: flex-start; flex-direction: column; padding: 16px; }
      .messages, .trajectory { padding-left: 16px; padding-right: 16px; }
      .bubble { max-width: 92%; }
      .composer { padding: 14px 16px 16px; }
      .node-detail-head { align-items: flex-start; flex-direction: column; gap: 8px; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="brand-row">
        <div class="brand">
          <div class="mark">TP</div>
          <div>
            <h1>TripPilot 途行智驾</h1>
            <p class="subtitle">最小体验控制台 · 确定性演示链路</p>
          </div>
        </div>
        <div class="badges" aria-label="数据与环境说明">
          <span class="badge">座舱状态·模拟</span>
          <span class="badge">地图天气·录制数据</span>
          <span class="badge">无需真实车辆</span>
        </div>
      </div>
    </header>

    <section class="scenario-panel" aria-labelledby="scenario-title">
      <h2 class="section-title" id="scenario-title">15 个体验场景</h2>
      <p class="scenario-note">媒体 / 车控 / 限号 / 知识问答四类工具尚未接入：点击后仍走真实链路，页面会如实显示“未执行工具调用”，不伪造结果。</p>
      <div class="scenario-groups" id="scenarios">
        <section class="scenario-group">
          <h3>导航</h3>
          <div class="scenario-list">
            <button class="scenario" type="button" data-scenario="nav-798">带我去798</button>
            <button class="scenario" type="button" data-scenario="nav-sanlitun">去三里屯</button>
            <button class="scenario" type="button" data-scenario="nav-yizhuang-avoid-traffic">去亦庄，避开拥堵</button>
            <button class="scenario" type="button" data-scenario="nav-distance">还有多远</button>
            <button class="scenario" type="button" data-scenario="nav-xueyuan-road-eta">去学院路，几点能到</button>
            <button class="scenario" type="button" data-scenario="nav-airport">去机场</button>
            <button class="scenario" type="button" data-scenario="nav-ulanchabu-next-week">下周想开车去乌兰察布，帮我规划一下</button>
          </div>
        </section>
        <section class="scenario-group">
          <h3>天气</h3>
          <div class="scenario-list">
            <button class="scenario" type="button" data-scenario="weather-chaobai">一会儿去潮白河，天气怎么样</button>
          </div>
        </section>
        <section class="scenario-group">
          <h3>限号</h3>
          <div class="scenario-list">
            <button class="scenario" type="button" data-scenario="restriction-caishikou">今天限号吗，我要去菜市口</button>
            <button class="scenario" type="button" data-scenario="restriction-sanlitun">去三里屯，顺便帮我看看今天限号吗</button>
          </div>
        </section>
        <section class="scenario-group">
          <h3>媒体</h3>
          <div class="scenario-list">
            <button class="scenario" type="button" data-scenario="media-next">换首歌</button>
          </div>
        </section>
        <section class="scenario-group">
          <h3>车控</h3>
          <div class="scenario-list">
            <button class="scenario" type="button" data-scenario="vehicle-hvac">有点热，空调开大点，顺便把天窗打开，音量调小点</button>
          </div>
        </section>
        <section class="scenario-group">
          <h3>知识问答</h3>
          <div class="scenario-list">
            <button class="scenario" type="button" data-scenario="knowledge-798">798为什么叫798</button>
          </div>
        </section>
        <section class="scenario-group">
          <h3>澄清</h3>
          <div class="scenario-list">
            <button class="scenario" type="button" data-scenario="clarify-river">去那个河边</button>
            <button class="scenario" type="button" data-scenario="clarify-yizhuang">去亦庄</button>
          </div>
        </section>
      </div>
    </section>

    <div class="workspace">
      <section class="panel chat-panel" aria-labelledby="chat-title">
        <div class="panel-head">
          <h2 id="chat-title">对话</h2>
          <div class="vehicle-controls" aria-label="座舱模拟状态">
            <button type="button" class="active" data-vehicle="parked_simulated">驻车模拟</button>
            <button type="button" data-vehicle="driving_simulated">行驶模拟</button>
          </div>
        </div>
        <div class="messages" id="messages" aria-live="polite">
          <div class="empty" id="chat-empty">输入一句话，或从上方选择场景。<br>回答与轨迹都来自同一次后端执行。</div>
        </div>
        <div class="confirm-box" id="confirm-box">
          <div class="confirm-copy" id="confirm-copy"></div>
          <button class="confirm-button" id="confirm-button" type="button">确认</button>
        </div>
        <form class="composer" id="composer">
          <input id="question" type="text" autocomplete="off" placeholder="输入你的出行请求" aria-label="出行请求">
          <button class="send-button" id="send-button" type="submit">发送</button>
        </form>
      </section>

      <section class="panel trace-panel" aria-labelledby="trace-title">
        <div class="panel-head">
          <h2 id="trace-title">Trajectory 节点轨迹</h2>
          <span class="trace-meta" id="trace-meta">等待执行</span>
        </div>
        <div id="timeline">
          <div class="trace-empty">执行后，这里会区分走过、跳过与被策略拦截的节点。点击节点可查看输入输出摘要。</div>
        </div>
      </section>
    </div>
  </main>

  <script>
    let sessionId = null;
    let vehicleState = "parked_simulated";
    let confirmNonce = null;
    let requestInFlight = false;
    let lastResponse = null;
    const mainNodes = ["intent", "clarify", "planner", "policy_gate", "tool_executor", "verifier"];
    const auxiliaryNodes = ["memory_recall", "human_confirm", "memory_capture", "recovery"];
    const nodeLabels = {
      intent: "意图识别", memory_recall: "偏好召回", clarify: "信息澄清",
      planner: "任务规划", policy_gate: "安全策略", human_confirm: "用户确认",
      tool_executor: "工具执行", verifier: "结果验证", memory_capture: "偏好记录",
      recovery: "失败恢复",
    };
    const query = new URLSearchParams(window.location.search);
    const apiParameter = query.get("api");
    // 去掉尾斜杠：防止 `${apiBase}/turn` 拼成双斜杠；?api= 跨域时后端仍需配 CORS，页面只负责把地址拼对。
    const apiBase = apiParameter ? apiParameter.replace(/\/+$/, "") : "";
    const messages = document.getElementById("messages");
    const question = document.getElementById("question");
    const sendButton = document.getElementById("send-button");
    const confirmBox = document.getElementById("confirm-box");

    function addMessage(role, text, isError = false) {
      document.getElementById("chat-empty")?.remove();
      const row = document.createElement("div");
      row.className = `message ${role}${isError ? " error" : ""}`;
      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.textContent = text;
      row.appendChild(bubble);
      messages.appendChild(row);
      messages.scrollTop = messages.scrollHeight;
    }

    function setBusy(busy) {
      requestInFlight = busy;
      sendButton.disabled = busy;
      question.disabled = busy;
      sendButton.textContent = busy ? "处理中" : "发送";
    }

    function showConfirmation(response) {
      confirmNonce = response.pending_memory_confirms?.[0]?.nonce ?? null;
      if (!response.needs_user_input) {
        confirmBox.classList.remove("visible");
        return;
      }
      const copy = document.getElementById("confirm-copy");
      const button = document.getElementById("confirm-button");
      copy.textContent = confirmNonce ? response.final_response : "请在输入框补充信息后继续。";
      button.style.display = confirmNonce ? "block" : "none";
      confirmBox.classList.add("visible");
    }

    function toolNames(steps) {
      return (steps || []).map((step) => step.tool).filter(Boolean);
    }

    function decisionName(decision) {
      return {allow: "允许", deny: "拦截", confirm: "需确认", degrade: "降级"}[decision] || decision;
    }

    function describePolicy(decisions) {
      if (!decisions.length) return "输出：没有工具调用需要策略判断。";
      const parts = decisions.map((item) => {
        const reason = item.detail || `规则 ${item.reason_code}`;
        return `${decisionName(item.decision)}：${reason}`;
      });
      return `输出：${parts.join("；")}。`;
    }

    function describeResults(results) {
      if (!results.length) return "输出：未执行工具调用。";
      const parts = results.map((item) => `${item.tool} ${item.ok ? "成功" : `失败（${item.error || "未返回原因"}）`}`);
      return `输出：${parts.join("；")}。`;
    }

    function describeVerification(verification) {
      if (!verification || Object.keys(verification).length === 0) return "输出：没有验证结果。";
      if (verification.ok && verification.task_completed) return "输出：安全检查通过，任务完成。";
      const failures = verification.failures || [];
      if (verification.ok) return `输出：安全检查通过，但任务未完成${failures.length ? `（${failures.join("；")}）` : ""}。`;
      return `输出：安全检查未通过${failures.length ? `（${failures.join("；")}）` : ""}。`;
    }

    function describeEvent(item) {
      const payload = item.payload || {};
      if (item.node === "intent") return `输入：用户请求“${payload.text || "空输入"}”；输出：已提取为本轮意图。`;
      if (item.node === "memory_recall") return `输出：召回 ${payload.count || 0} 条偏好${payload.error ? "，召回失败并已留痕" : ""}。`;
      if (item.node === "clarify") return payload.need_clarify ? "输出：当前信息不足，需要用户补充后继续。" : "输出：信息足够，可以进入任务规划。";
      if (item.node === "planner") {
        const names = toolNames(payload.steps);
        return names.length ? `输出：计划调用 ${names.join("、")}。` : "输出：规划完成，未生成工具调用。";
      }
      if (item.node === "policy_gate" && item.event === "degraded_params") return "输出：为满足安全策略，已缩减工具参数。";
      if (item.node === "policy_gate") return describePolicy(payload.decisions || []);
      if (item.node === "human_confirm") return payload.confirmed ? "输入：用户确认；输出：确认凭证通过。" : "输出：等待用户确认，尚未执行后续操作。";
      if (item.node === "tool_executor") return describeResults(payload.results || []);
      if (item.node === "memory_capture") {
        if (payload.written?.length) return `输出：写入 ${payload.written.length} 条已确认偏好。`;
        if (payload.pending) return `输出：有 ${payload.pending} 条偏好等待用户确认。`;
        return "输出：没有写入新的偏好。";
      }
      if (item.node === "recovery") return `输出：进入第 ${payload.recovery_count || 1} 次确定性恢复并准备重试。`;
      return "该节点已执行，但本次事件没有可展示的摘要。";
    }

    function summariesForNode(response, node, visited) {
      if (!visited) return ["本轮未经过该节点，因此没有输入输出事件。"];
      // verifier 的 trace 事件 payload 里没有 ok 字段，用顶层 verification 摘要代替，
      // 否则会把成功验证说成"安全检查未通过"，还和正确的摘要前后矛盾。
      if (node === "verifier") return [describeVerification(response.verification)];
      const summaries = (response.trace || []).filter((item) => item.node === node).map(describeEvent);
      if (node === "policy_gate" && !summaries.length) summaries.push(describePolicy(response.policy_decisions || []));
      return summaries.length ? summaries : ["节点已经过，但本轮 trace 没有记录可展示的事件。"];
    }

    function nodeStatus(response, node) {
      // graph 只记录实际经过的节点，visited_nodes 里没出现即为跳过；
      // 跳过的节点没有事件可展示，详情里如实说明，不补造。
      const visited = (response.visited_nodes || []).includes(node);
      const denied = node === "policy_gate" && (response.policy_decisions || []).some((item) => item.decision === "deny");
      if (denied) return "blocked";
      return visited ? "visited" : "skipped";
    }

    function renderNodeDetail(node) {
      const detail = document.getElementById("node-detail");
      const status = nodeStatus(lastResponse, node);
      const statusLabel = {visited: "已走过", skipped: "已跳过", blocked: "已拦截"}[status];
      detail.replaceChildren();
      const head = document.createElement("div");
      head.className = "node-detail-head";
      const title = document.createElement("h3");
      title.textContent = nodeLabels[node];
      const code = document.createElement("span");
      code.className = "node-code";
      code.textContent = node;
      title.appendChild(code);
      const badge = document.createElement("span");
      badge.className = `status ${status}`;
      badge.textContent = statusLabel;
      head.append(title, badge);
      const list = document.createElement("ul");
      list.className = "node-summary";
      summariesForNode(lastResponse, node, status !== "skipped").forEach((summary) => {
        const item = document.createElement("li");
        item.textContent = summary;
        list.appendChild(item);
      });
      detail.append(head, list);
      document.querySelectorAll(".node-chip").forEach((chip) => {
        const selected = chip.dataset.node === node;
        chip.classList.toggle("selected", selected);
        chip.setAttribute("aria-expanded", String(selected));
      });
    }

    function makeNodeChip(response, node) {
      const chip = document.createElement("button");
      chip.type = "button";
      chip.className = `node-chip ${nodeStatus(response, node)}`;
      chip.dataset.node = node;
      chip.textContent = nodeLabels[node];
      chip.title = node;
      chip.setAttribute("aria-expanded", "false");
      chip.addEventListener("click", () => renderNodeDetail(node));
      return chip;
    }

    function makeNodeSection(response, title, nodes) {
      const section = document.createElement("section");
      section.className = "node-section";
      const heading = document.createElement("h3");
      heading.className = "node-section-title";
      heading.textContent = title;
      const chips = document.createElement("div");
      chips.className = "node-chips";
      nodes.forEach((node) => chips.appendChild(makeNodeChip(response, node)));
      section.append(heading, chips);
      return section;
    }

    function renderTimeline(response) {
      lastResponse = response;
      const timeline = document.getElementById("timeline");
      timeline.replaceChildren();
      const trajectory = document.createElement("div");
      trajectory.className = "trajectory";
      trajectory.append(
        makeNodeSection(response, "主链路", mainNodes),
        makeNodeSection(response, "辅助节点", auxiliaryNodes),
      );
      const detail = document.createElement("section");
      detail.className = "node-detail";
      detail.id = "node-detail";
      detail.setAttribute("aria-live", "polite");
      trajectory.appendChild(detail);
      timeline.appendChild(trajectory);
      document.getElementById("trace-meta").textContent = response.trace_id;
      const firstNode = nodeStatus(response, "policy_gate") === "blocked"
        ? "policy_gate"
        : (response.visited_nodes || [])[0] || "intent";
      renderNodeDetail(firstNode);
    }

    async function sendTurn(text, extra = {}, displayText = text) {
      if (requestInFlight || (!text.trim() && !extra.confirm)) return;
      if (displayText) addMessage("user", displayText);
      setBusy(true);
      try {
        const response = await fetch(`${apiBase}/turn`, {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({session_id: sessionId, text, vehicle_state: vehicleState, ...extra}),
        });
        // JSON 解析失败不能吞：解析错了后面渲染的全是假成功。
        let body;
        try {
          body = await response.json();
        } catch {
          throw new Error("后端没有返回合法 JSON，请检查 api 参数指向的地址");
        }
        if (!response.ok) throw new Error(body.detail || `后端返回 ${response.status}`);
        // 契约缺了关键字段就不渲染，避免 trace_id 之类显示成 undefined。
        if (!body || !Array.isArray(body.visited_nodes) || !Array.isArray(body.trace)) {
          throw new Error("后端返回的结构不符合 /turn 契约，请检查 api 参数指向的地址");
        }
        sessionId = body.session_id;
        addMessage("assistant", body.final_response || "本轮没有返回回答。");
        renderTimeline(body);
        showConfirmation(body);
      } catch (error) {
        addMessage("assistant", `请求失败：${error.message}。请检查后端是否可访问，以及 URL 中的 api 参数是否正确。`, true);
      } finally {
        setBusy(false);
        question.focus();
      }
    }

    document.getElementById("composer").addEventListener("submit", (event) => {
      event.preventDefault();
      const text = question.value.trim();
      if (!text) return;
      question.value = "";
      sendTurn(text);
    });
    document.getElementById("scenarios").addEventListener("click", (event) => {
      const button = event.target.closest("button[data-scenario]");
      if (button) sendTurn(button.textContent.trim());
    });
    document.querySelector(".vehicle-controls").addEventListener("click", (event) => {
      const button = event.target.closest("button[data-vehicle]");
      if (!button) return;
      vehicleState = button.dataset.vehicle;
      document.querySelectorAll("button[data-vehicle]").forEach((item) => item.classList.remove("active"));
      button.classList.add("active");
    });
    document.getElementById("confirm-button").addEventListener("click", () => {
      if (!confirmNonce) return;
      confirmBox.classList.remove("visible");
      sendTurn("", {confirm: true, confirm_nonce: confirmNonce}, "确认");
    });

    const linkedScenario = query.get("scenario");
    if (linkedScenario) {
      const button = Array.from(document.querySelectorAll("button[data-scenario]"))
        .find((item) => item.dataset.scenario === linkedScenario);
      if (button) sendTurn(button.textContent.trim());
    }
  </script>
</body>
</html>
