<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TripPilot 最小体验控制台</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #15211d;
      --muted: #68756f;
      --paper: #fffdf8;
      --line: #dce4df;
      --green: #176b4d;
      --green-soft: #e7f2ec;
      --amber: #a45d12;
      --amber-soft: #fff0d9;
      --shadow: 0 16px 42px rgba(24, 48, 39, .09);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--ink);
      background: radial-gradient(circle at top left, #e8f2eb 0, transparent 34rem), #f3f1ea;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, "PingFang SC", sans-serif;
    }
    button, input { font: inherit; }
    button { cursor: pointer; }
    button:disabled { cursor: wait; opacity: .58; }
    .shell { width: min(1180px, calc(100% - 32px)); margin: 0 auto; padding-bottom: 36px; }
    .topbar {
      position: sticky;
      top: 0;
      z-index: 5;
      margin: 0 -16px;
      padding: 18px 16px 14px;
      background: rgba(243, 241, 234, .92);
      border-bottom: 1px solid rgba(120, 134, 126, .2);
      backdrop-filter: blur(16px);
    }
    .brand-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .brand { display: flex; align-items: center; gap: 12px; }
    .mark {
      display: grid;
      width: 42px;
      height: 42px;
      place-items: center;
      border-radius: 14px;
      color: white;
      background: var(--green);
      font-weight: 800;
      letter-spacing: -.04em;
    }
    h1 { margin: 0; font-size: 20px; letter-spacing: -.02em; }
    .subtitle { margin: 3px 0 0; color: var(--muted); font-size: 12px; }
    .badges { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 7px; }
    .badge {
      padding: 6px 10px;
      border: 1px solid #cddad2;
      border-radius: 999px;
      color: #315245;
      background: rgba(255, 255, 255, .7);
      font-size: 12px;
      font-weight: 650;
    }
    .scenario-panel { padding: 20px 0 16px; }
    .section-title { margin: 0 0 10px; font-size: 13px; color: var(--muted); font-weight: 700; }
    .scenario-list { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 10px; }
    .scenario {
      flex: 0 0 auto;
      padding: 9px 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
      color: #32463e;
      background: rgba(255, 255, 255, .76);
    }
    .scenario:hover { border-color: #91aa9d; background: white; }
    .workspace { display: grid; grid-template-columns: minmax(0, 1.08fr) minmax(340px, .92fr); gap: 18px; }
    .panel { border: 1px solid var(--line); border-radius: 20px; background: var(--paper); box-shadow: var(--shadow); }
    .chat-panel { min-height: 660px; display: flex; flex-direction: column; overflow: hidden; }
    .panel-head {
      display: flex;
      min-height: 64px;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 18px;
      border-bottom: 1px solid var(--line);
    }
    .panel-head h2 { margin: 0; font-size: 15px; }
    .vehicle-controls { display: flex; align-items: center; gap: 6px; padding: 4px; border-radius: 11px; background: #edf0ed; }
    .vehicle-controls button {
      padding: 7px 10px;
      border: 0;
      border-radius: 8px;
      color: var(--muted);
      background: transparent;
      font-size: 12px;
    }
    .vehicle-controls button.active { color: white; background: var(--green); }
    .messages { flex: 1; min-height: 360px; padding: 22px 18px; overflow-y: auto; }
    .empty { max-width: 420px; margin: 100px auto; text-align: center; color: var(--muted); line-height: 1.7; }
    .message { display: flex; margin-bottom: 16px; }
    .message.user { justify-content: flex-end; }
    .bubble { max-width: 82%; padding: 11px 14px; border-radius: 15px; line-height: 1.6; white-space: pre-wrap; }
    .assistant .bubble { background: #eef3ef; border-bottom-left-radius: 4px; }
    .user .bubble { color: white; background: var(--green); border-bottom-right-radius: 4px; }
    .error .bubble { color: #8e361d; background: #ffebe3; }
    .confirm-box { display: none; margin: 0 18px 14px; padding: 13px; border: 1px solid #eccd99; border-radius: 12px; background: var(--amber-soft); }
    .confirm-box.visible { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .confirm-copy { color: #76501f; font-size: 13px; line-height: 1.45; }
    .confirm-button { flex: 0 0 auto; padding: 9px 13px; border: 0; border-radius: 9px; color: white; background: var(--amber); }
    .composer { display: flex; gap: 9px; padding: 14px 18px 18px; border-top: 1px solid var(--line); }
    .composer input { flex: 1; min-width: 0; padding: 12px 14px; border: 1px solid #cfd8d2; border-radius: 11px; color: var(--ink); background: white; outline: none; }
    .composer input:focus { border-color: var(--green); box-shadow: 0 0 0 3px rgba(23, 107, 77, .12); }
    .send-button { padding: 11px 18px; border: 0; border-radius: 11px; color: white; background: var(--green); font-weight: 700; }
    .trace-panel { min-height: 660px; padding-bottom: 18px; }
    .trace-meta { color: var(--muted); font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; }
    .timeline { padding: 20px 20px 4px 28px; }
    .trace-empty { margin: 110px 28px; color: var(--muted); text-align: center; line-height: 1.7; }
    .trace-item { position: relative; padding: 0 0 20px 22px; border-left: 2px solid #d6e2da; }
    .trace-item:last-child { padding-bottom: 2px; border-left-color: transparent; }
    .trace-dot { position: absolute; top: 1px; left: -7px; width: 12px; height: 12px; border: 3px solid var(--paper); border-radius: 50%; background: var(--green); box-shadow: 0 0 0 1px var(--green); }
    .trace-node { margin: 0 0 5px; color: #285341; font: 700 12px ui-monospace, SFMono-Regular, Menlo, monospace; }
    .trace-summary { margin: 0; color: #52615b; font-size: 13px; line-height: 1.55; }
    .trace-event { display: inline-block; margin-top: 7px; padding: 3px 7px; border-radius: 6px; color: #50625a; background: var(--green-soft); font-size: 10px; }
    @media (max-width: 820px) {
      .brand-row { align-items: flex-start; flex-direction: column; }
      .badges { justify-content: flex-start; }
      .workspace { grid-template-columns: 1fr; }
      .chat-panel, .trace-panel { min-height: auto; }
      .messages { min-height: 380px; }
    }
    @media (max-width: 520px) {
      .shell { width: min(100% - 20px, 1180px); }
      .panel-head { align-items: flex-start; flex-direction: column; }
      .bubble { max-width: 92%; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="topbar">
      <div class="brand-row">
        <div class="brand">
          <div class="mark">TP</div>
          <div>
            <h1>TripPilot 途行智驾</h1>
            <p class="subtitle">最小体验控制台 · 确定性演示链路</p>
          </div>
        </div>
        <div class="badges" aria-label="数据与环境说明">
          <span class="badge">座舱状态·模拟</span>
          <span class="badge">地图天气·录制数据</span>
          <span class="badge">无需真实车辆</span>
        </div>
      </div>
    </header>

    <section class="scenario-panel" aria-labelledby="scenario-title">
      <h2 class="section-title" id="scenario-title">15 个体验场景</h2>
      <div class="scenario-list" id="scenarios">
        <button class="scenario" type="button">带我去798</button>
        <button class="scenario" type="button">去三里屯</button>
        <button class="scenario" type="button">一会儿去潮白河，天气怎么样</button>
        <button class="scenario" type="button">今天限号吗，我要去菜市口</button>
        <button class="scenario" type="button">去亦庄，避开拥堵</button>
        <button class="scenario" type="button">还有多远</button>
        <button class="scenario" type="button">去学院路，几点能到</button>
        <button class="scenario" type="button">去机场</button>
        <button class="scenario" type="button">下周想开车去乌兰察布，帮我规划一下</button>
        <button class="scenario" type="button">换首歌</button>
        <button class="scenario" type="button">798为什么叫798</button>
        <button class="scenario" type="button">有点热，空调开大点，顺便把天窗打开，音量调小点</button>
        <button class="scenario" type="button">去三里屯，顺便帮我看看今天限号吗</button>
        <button class="scenario" type="button">去那个河边</button>
        <button class="scenario" type="button">去亦庄</button>
      </div>
    </section>

    <div class="workspace">
      <section class="panel chat-panel" aria-labelledby="chat-title">
        <div class="panel-head">
          <h2 id="chat-title">对话</h2>
          <div class="vehicle-controls" aria-label="座舱模拟状态">
            <button type="button" class="active" data-vehicle="parked_simulated">驻车模拟</button>
            <button type="button" data-vehicle="driving_simulated">行驶模拟</button>
          </div>
        </div>
        <div class="messages" id="messages" aria-live="polite">
          <div class="empty" id="chat-empty">输入一句话，或从上方选择场景。<br>回答与轨迹都来自同一次后端执行。</div>
        </div>
        <div class="confirm-box" id="confirm-box">
          <div class="confirm-copy" id="confirm-copy"></div>
          <button class="confirm-button" id="confirm-button" type="button">确认</button>
        </div>
        <form class="composer" id="composer">
          <input id="question" type="text" autocomplete="off" placeholder="输入你的出行请求" aria-label="出行请求">
          <button class="send-button" id="send-button" type="submit">发送</button>
        </form>
      </section>

      <section class="panel trace-panel" aria-labelledby="trace-title">
        <div class="panel-head">
          <h2 id="trace-title">Trajectory 时间线</h2>
          <span class="trace-meta" id="trace-meta">等待执行</span>
        </div>
        <div id="timeline">
          <div class="trace-empty">执行后，这里会按实际经过顺序解释每个节点。未调用工具时也会如实显示。</div>
        </div>
      </section>
    </div>
  </main>

  <script>
    let sessionId = null;
    let vehicleState = "parked_simulated";
    let confirmNonce = null;
    let requestInFlight = false;
    const messages = document.getElementById("messages");
    const question = document.getElementById("question");
    const sendButton = document.getElementById("send-button");
    const confirmBox = document.getElementById("confirm-box");

    function addMessage(role, text, isError = false) {
      document.getElementById("chat-empty")?.remove();
      const row = document.createElement("div");
      row.className = `message ${role}${isError ? " error" : ""}`;
      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.textContent = text;
      row.appendChild(bubble);
      messages.appendChild(row);
      messages.scrollTop = messages.scrollHeight;
    }

    function setBusy(busy) {
      requestInFlight = busy;
      sendButton.disabled = busy;
      question.disabled = busy;
      sendButton.textContent = busy ? "处理中" : "发送";
    }

    function showConfirmation(response) {
      confirmNonce = response.pending_memory_confirms?.[0]?.nonce ?? null;
      if (!response.needs_user_input) {
        confirmBox.classList.remove("visible");
        return;
      }
      const copy = document.getElementById("confirm-copy");
      const button = document.getElementById("confirm-button");
      copy.textContent = confirmNonce ? response.final_response : "请在输入框补充信息后继续。";
      button.style.display = confirmNonce ? "block" : "none";
      confirmBox.classList.add("visible");
    }

    function groupTraceByVisit(nodes, trace) {
      let cursor = 0;
      return nodes.map((node) => {
        while (cursor < trace.length && trace[cursor].node !== node) cursor += 1;
        const events = [];
        while (cursor < trace.length && trace[cursor].node === node) {
          events.push(trace[cursor]);
          cursor += 1;
        }
        return {node, events};
      });
    }

    function toolNames(steps) {
      return (steps || []).map((step) => step.tool).filter(Boolean);
    }

    function describeEvent(item) {
      const payload = item.payload || {};
      if (item.node === "intent") return `识别请求：“${payload.text || "空输入"}”。`;
      if (item.node === "memory_recall") return `召回 ${payload.count || 0} 条偏好${payload.error ? "，召回失败已留痕" : ""}。`;
      if (item.node === "clarify") return payload.need_clarify ? "需要补充信息后再继续。" : "信息足够，继续规划。";
      if (item.node === "planner") {
        const names = toolNames(payload.steps);
        return names.length ? `计划调用：${names.join("、")}。` : "规划完成，未生成工具调用。";
      }
      if (item.node === "policy_gate") return describePolicy(payload.decisions || []);
      if (item.node === "human_confirm") return payload.confirmed ? "确认凭证已通过。" : "等待用户确认，尚未执行。";
      if (item.node === "tool_executor") return describeResults(payload.results || []);
      if (item.node === "verifier") return payload.task_completed ? "安全检查通过，任务完成。" : `任务未完成：${(payload.failures || []).join("、") || "没有可验证的结果"}。`;
      if (item.node === "memory_capture") return payload.written?.length ? `写入 ${payload.written.length} 条已确认偏好。` : "没有写入新的偏好。";
      if (item.node === "recovery") return "工具失败后进行一次确定性恢复。";
      return `记录事件 ${item.event}。`;
    }

    function describePolicy(decisions) {
      if (!decisions.length) return "没有工具调用需要策略判断。";
      const parts = decisions.map((item) => `${item.decision}（${item.reason_code}）`);
      return `策略判断：${parts.join("、")}。`;
    }

    function describeResults(results) {
      if (!results.length) return "未执行工具调用。";
      const parts = results.map((item) => `${item.tool} ${item.ok ? "成功" : "失败"}`);
      return `执行结果：${parts.join("、")}。`;
    }

    function renderTimeline(response) {
      const timeline = document.getElementById("timeline");
      timeline.replaceChildren();
      const list = document.createElement("div");
      list.className = "timeline";
      const visits = groupTraceByVisit(response.visited_nodes || [], response.trace || []);
      visits.forEach((visit) => list.appendChild(makeTraceItem(visit)));
      timeline.appendChild(list);
      document.getElementById("trace-meta").textContent = response.trace_id;
    }

    function makeTraceItem(visit) {
      const item = document.createElement("div");
      item.className = "trace-item";
      const dot = document.createElement("span");
      dot.className = "trace-dot";
      const name = document.createElement("h3");
      name.className = "trace-node";
      name.textContent = visit.node;
      item.append(dot, name);
      const events = visit.events.length ? visit.events : [{node: visit.node, event: "visited", payload: {}}];
      events.forEach((event) => appendEvent(item, event));
      return item;
    }

    function appendEvent(parent, event) {
      const summary = document.createElement("p");
      summary.className = "trace-summary";
      summary.textContent = describeEvent(event);
      const eventName = document.createElement("span");
      eventName.className = "trace-event";
      eventName.textContent = event.event;
      parent.append(summary, eventName);
    }

    async function sendTurn(text, extra = {}, displayText = text) {
      if (requestInFlight || (!text.trim() && !extra.confirm)) return;
      if (displayText) addMessage("user", displayText);
      setBusy(true);
      try {
        const response = await fetch("/turn", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({session_id: sessionId, text, vehicle_state: vehicleState, ...extra}),
        });
        const body = await response.json();
        if (!response.ok) throw new Error(body.detail || "请求失败");
        sessionId = body.session_id;
        addMessage("assistant", body.final_response || "本轮没有返回回答。");
        renderTimeline(body);
        showConfirmation(body);
      } catch (error) {
        addMessage("assistant", `请求失败：${error.message}`, true);
      } finally {
        setBusy(false);
        question.focus();
      }
    }

    document.getElementById("composer").addEventListener("submit", (event) => {
      event.preventDefault();
      const text = question.value.trim();
      if (!text) return;
      question.value = "";
      sendTurn(text);
    });

    document.getElementById("scenarios").addEventListener("click", (event) => {
      const button = event.target.closest("button");
      if (button) sendTurn(button.textContent.trim());
    });

    document.querySelector(".vehicle-controls").addEventListener("click", (event) => {
      const button = event.target.closest("button[data-vehicle]");
      if (!button) return;
      vehicleState = button.dataset.vehicle;
      document.querySelectorAll("button[data-vehicle]").forEach((item) => item.classList.remove("active"));
      button.classList.add("active");
    });

    document.getElementById("confirm-button").addEventListener("click", () => {
      if (!confirmNonce) return;
      confirmBox.classList.remove("visible");
      sendTurn("", {confirm: true, confirm_nonce: confirmNonce}, "确认");
    });
  </script>
</body>
</html>
